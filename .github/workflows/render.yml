name: Render Creative Promo Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install System Dependencies (ImageMagick & FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          REQ_PATH=$(find . -name "requirements.txt" | head -n 1)
          pip install -r "$REQ_PATH"

      - name: Render Final Video
        run: |
          SCRIPT_PATH=$(find . -name "build_video.py" | head -n 1)
          echo "Found script at: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final-Creative-Promo
          path: final_promo.mp4
          
